<app-onboarding-shell
  [step]="1"
  [showBack]="false"
  title="let's get to know you"
  subtitle="this helps us personalize gurtundaa for your needs"
  (continueClick)="continue()"
  (skip)="skip()"
>
  <div class="options">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="option"
        [class.selected]="state.accountType() === option.value"
        (click)="select(option.value)"
      >
        <span class="icon" aria-hidden="true">{{ option.icon }}</span>
        <span class="text">
          <strong>{{ option.label }}</strong>
          <span class="hint">{{ option.hint }}</span>
        </span>
      </button>
    }
  </div>
</app-onboarding-shell>
