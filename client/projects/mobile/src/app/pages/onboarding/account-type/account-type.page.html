<app-onboarding-shell
  [step]="1"
  [showBack]="false"
  title="onboarding.accountType.title"
  subtitle="onboarding.accountType.subtitle"
  (continueClick)="continue()"
  (skip)="skip()"
>
  <div class="options">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="option"
        [class.selected]="state.accountType() === option.value"
        (click)="select(option.value)"
      >
        <span class="icon" aria-hidden="true">{{ option.icon }}</span>
        <span class="text">
          <strong>{{ 'onboarding.accountTypes.' + option.value + '.label' | translate }}</strong>
          <span class="hint">{{ 'onboarding.accountTypes.' + option.value + '.hint' | translate }}</span>
        </span>
      </button>
    }
  </div>
</app-onboarding-shell>
