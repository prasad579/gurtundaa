<app-onboarding-shell
  [step]="4"
  title="onboarding.location.title"
  subtitle="onboarding.location.subtitle"
  (back)="back()"
  (continueClick)="continue()"
  (skip)="skip()"
>
  <label class="city-field">
    <span>{{ 'onboarding.location.city' | translate }}</span>
    <input
      type="text"
      [value]="state.city()"
      [placeholder]="'onboarding.location.cityPlaceholder' | translate"
      (input)="onCityInput($any($event.target).value)"
    />
  </label>

  <div class="why">
    <strong>{{ 'onboarding.location.whyTitle' | translate }}</strong>
    <ul>
      <li>{{ 'onboarding.location.why1' | translate }}</li>
      <li>{{ 'onboarding.location.why2' | translate }}</li>
      <li>{{ 'onboarding.location.why3' | translate }}</li>
    </ul>
  </div>
</app-onboarding-shell>
