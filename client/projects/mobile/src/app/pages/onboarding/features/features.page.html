<app-onboarding-shell
  [step]="3"
  title="onboarding.features.title"
  subtitle="onboarding.features.subtitle"
  (back)="back()"
  (continueClick)="continue()"
  (skip)="skip()"
>
  <div class="grid">
    @for (option of options; track option.key) {
      <button
        type="button"
        class="feature"
        [class.selected]="state.enabledFeatures().has(option.key)"
        (click)="toggle(option.key)"
      >
        <span class="top">
          <span class="icon" aria-hidden="true">{{ option.icon }}</span>
          <span class="check" [class.checked]="state.enabledFeatures().has(option.key)">
            @if (state.enabledFeatures().has(option.key)) { ✓ }
          </span>
        </span>
        <strong>{{ 'onboarding.featureOptions.' + option.key + '.label' | translate }}</strong>
        <span class="hint">{{ 'onboarding.featureOptions.' + option.key + '.hint' | translate }}</span>
      </button>
    }
  </div>
</app-onboarding-shell>
