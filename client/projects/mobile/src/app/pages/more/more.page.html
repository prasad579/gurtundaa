<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>More</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list [inset]="true">
    <ion-item [button]="true" [detail]="true" (click)="openProfile()">
      <ion-icon slot="start" name="home-outline" />
      <ion-label>
        <h2>Household Profile</h2>
        @if (email) {
          <p>{{ email }}</p>
        }
      </ion-label>
    </ion-item>

    <ion-item [button]="true" [detail]="true" (click)="openContacts()">
      <ion-icon slot="start" name="people-outline" />
      <ion-label>Contacts</ion-label>
    </ion-item>

    <ion-item [button]="true" [detail]="false" (click)="linkToProvider()">
      <ion-icon slot="start" name="link-outline" />
      <ion-label>
        <h2>Link to a Provider</h2>
        <p>Have a code from your milkman or dhobi? Enter it here.</p>
      </ion-label>
    </ion-item>

    <ion-item [button]="true" [detail]="false" (click)="logout()">
      <ion-icon slot="start" name="log-out-outline" color="danger" />
      <ion-label color="danger">Log out</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
